/* ====================================================================
   WEEBALON ENCOUNTER BOARD

   Native resolution 512 x 360. Scaled by the largest whole number that
   fits the window. At 1536x1080 that lands on exactly x3.

   No server. No storage. No accounts. State lives in this tab and dies
   when you close it, which is why a public URL is harmless -- a visitor
   loads their own copy and can't touch yours.

   All controls are keystrokes, so a Stream Deck drives this with no
   plugin. Keystrokes land on the FOCUSED window: click the board once.

/* -- 4. BITMAP FONT (3x5, same table as the Python generator) --------- */

const FONT = {

"O":["010","101","101","101","010"],"P":["110","101","110","100","100"],

"S":["011","100","010","001","110"],"T":["111","010","010","010","010"],
"U":["101","101","101","101","011"],"V":["101","101","101","101","010"],
"W":["101","101","111","111","101"],"X":["101","101","010","101","101"],
"Y":["101","101","010","010","010"],"Z":["111","001","010","100","111"],
};

function textW(s, k) { k = k || 1; return Math.max(0, s.length * 4 * k - k); }

function drawText(ctx, s, x, y, colour, k) {
  k = k || 1;
  ctx.fillStyle = colour;
  let cx = x;
  for (const ch of s.toUpperCase()) {
    const rows = FONT[ch];
    if (rows) {
      for (let ry = 0; ry < 5; ry++) {
        for (let rx = 0; rx < 3; rx++) {
          if (rows[ry][rx] === "1") {
            ctx.fillRect(cx + rx * k, y + ry * k, k, k);
          }
        }
      }
    }
    cx += 4 * k;
  }
}

function drawTextShadow(ctx, s, x, y, colour, k) {
  k = k || 1;
  drawText(ctx, s, x + k, y + k, "rgba(0,0,0,0.65)", k);
  drawText(ctx, s, x, y, colour, k);
}

function drawTextCentre(ctx, s, cx, y, colour, k) {
  drawTextShadow(ctx, s, Math.round(cx - textW(s, k) / 2), y, colour, k);
}

};

const UI = "ui/";
const NEED = {
  grid:      "wbl_ui_grid_16x8_32.png",
  objective: "wbl_ui_banner_objective_192x32.png",
  law:       "wbl_ui_banner_law_192x32.png",
  nameplate: "wbl_ui_nameplate_96x20.png",
  slotIdle:  "wbl_ui_initslot_idle_40.png",
  slotActive:"wbl_ui_initslot_active_40.png",
  slotDone:  "wbl_ui_initslot_done_40.png",
  pipFull:   "wbl_ui_hppip_full_8.png",
  pipEmpty:  "wbl_ui_hppip_empty_8.png",
  pipDead:   "wbl_ui_hppip_dead_8.png",
  elev_m2:   "wbl_ui_elev_m2_32.png",
  elev_m1:   "wbl_ui_elev_m1_32.png",
  elev_p1:   "wbl_ui_elev_p1_32.png",
  elev_p2:   "wbl_ui_elev_p2_32.png",
  elev_p3:   "wbl_ui_elev_p3_32.png",
};
for (let i = 0; i <= 6; i++) NEED["clock" + i] = "wbl_ui_clock6_" + i + ".png";

const IMG = {};
const MISSING = [];

function loadAll() {
  const keys = Object.keys(NEED);
  return Promise.all(keys.map(k => new Promise(res => {
    const im = new Image();
    im.onload  = () => { IMG[k] = im; res(); };
    im.onerror = () => { MISSING.push(NEED[k]); res(); };
    im.src = EMBEDDED[NEED[k]] || (UI + NEED[k]);
  })));
}

/* -- 6. STATE --------------------------------------------------------- */

const S = {
  clock: ENCOUNTER.clockMax,
  turn: 0,
  round: 1,
  lawOn: ENCOUNTER.lawActive,
  showGrid: true,
  showHelp: false,
  down: new Set(),
  units: ENCOUNTER.combatants.map(u => Object.assign({}, u)),
  mapImg: null,
};

/* -- 7. DRAW ---------------------------------------------------------- */

const cv  = document.getElementById("board");
const ctx = cv.getContext("2d");

function fitCanvas() {
  cv.width = NAT_W; cv.height = NAT_H;
  const k = Math.max(1, Math.floor(Math.min(
    window.innerWidth / NAT_W, window.innerHeight / NAT_H)));
  cv.style.width  = (NAT_W * k) + "px";
  cv.style.height = (NAT_H * k) + "px";
  ctx.imageSmoothingEnabled = false;
  draw();
}

function bevel(x, y, w, h, fill, hi, lo) {
  ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = hi;
  ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y, 1, h);
  ctx.fillStyle = lo;
  ctx.fillRect(x, y + h - 1, w, 1); ctx.fillRect(x + w - 1, y, 1, h);
}

function drawTopBar() {
  ctx.fillStyle = C.ink;
  ctx.fillRect(0, 0, NAT_W, TOP_H);
  ctx.fillStyle = C.frameDark;
  ctx.fillRect(0, TOP_H - 1, NAT_W, 1);

  if (IMG.objective) ctx.drawImage(IMG.objective, OBJ_X, BANNER_Y);
  drawTextCentre(ctx, ENCOUNTER.objective, OBJ_X + 96, BANNER_Y + 13, C.parchHi);

  if (S.lawOn) {
    if (IMG.law) ctx.drawImage(IMG.law, LAW_X, BANNER_Y);
    drawTextCentre(ctx, ENCOUNTER.law, LAW_X + 96, BANNER_Y + 13, C.goldHi);
  }

  const ck = IMG["clock" + Math.max(0, Math.min(6, S.clock))];
  if (ck) ctx.drawImage(ck, CLOCK_X, CLOCK_Y);
  drawText(ctx, "RD " + S.round, CLOCK_X + 14, CLOCK_Y - 9, C.frameLight);
}

function drawBoard() {
  ctx.fillStyle = C.boardBase;
  ctx.fillRect(0, BOARD_Y, NAT_W, BOARD_H);

  if (S.mapImg) ctx.drawImage(S.mapImg, 0, BOARD_Y, NAT_W, BOARD_H);

  for (const e of ENCOUNTER.elevation) {
    const key = "elev_" + (e.lv > 0 ? "p" : "m") + Math.abs(e.lv);
    if (IMG[key]) ctx.drawImage(IMG[key], e.x * CELL, BOARD_Y + e.y * CELL);
  }

  if (S.showGrid && IMG.grid) ctx.drawImage(IMG.grid, 0, BOARD_Y);

  // The plate is drawn BEFORE tokens so a token is never hidden behind it.
  // Tradeoff: in a crowded corner a token may clip the plate's edge. A
  // covered label is recoverable; a covered combatant is not.
  drawActivePlate();

  S.units.forEach((u, i) => {
    const px = u.x * CELL, py = BOARD_Y + u.y * CELL;
    const isDown = S.down.has(i);
    const col = isDown ? {fill: C.dead, hi: "#4a4a50"} : SIDE[u.side];
    bevel(px + 3, py + 3, CELL - 6, CELL - 6, col.fill, col.hi, C.ink);
    ctx.fillStyle = C.ink;
    ctx.fillRect(px + 2, py + 2, CELL - 4, 1);
    ctx.fillRect(px + 2, py + CELL - 3, CELL - 4, 1);
    ctx.fillRect(px + 2, py + 2, 1, CELL - 4);
    ctx.fillRect(px + CELL - 3, py + 2, 1, CELL - 4);
    drawTextCentre(ctx, u.tag, px + CELL / 2, py + CELL / 2 - 3,
                   isDown ? "#8a8a90" : C.parchHi);
    // Active combatant: gold ring on the token itself. A floating tick
    // collided with neighbouring tokens and the plate.
    if (i === S.turn) {
      ctx.fillStyle = C.goldHi;
      ctx.fillRect(px + 1, py + 1, CELL - 2, 1);
      ctx.fillRect(px + 1, py + CELL - 2, CELL - 2, 1);
      ctx.fillRect(px + 1, py + 1, 1, CELL - 2);
      ctx.fillRect(px + CELL - 2, py + 1, 1, CELL - 2);
    }
  });
}

function drawActivePlate() {
  const u = S.units[S.turn];
  if (!u) return;
  const plateW = 96, pipW = u.max * 8 + (u.max - 1);
  let px = Math.round(u.x * CELL + CELL / 2 - plateW / 2);
  px = Math.max(2, Math.min(NAT_W - plateW - 2, px));
  const above = u.y >= ROWS - 2;
  let py = above ? BOARD_Y + u.y * CELL - 32 : BOARD_Y + u.y * CELL + CELL + 3;

  if (IMG.nameplate) ctx.drawImage(IMG.nameplate, px, py);
  drawTextCentre(ctx, u.name, px + plateW / 2, py + 7, C.parchHi);

  const pipY = py + 22;
  const pipX = Math.round(px + plateW / 2 - pipW / 2);
  const dead = S.down.has(S.turn);
  for (let i = 0; i < u.max; i++) {
    const im = dead ? IMG.pipDead : (i < u.hp ? IMG.pipFull : IMG.pipEmpty);
    if (im) ctx.drawImage(im, pipX + i * 9, pipY);
  }
}

function drawInitStrip() {
  ctx.fillStyle = C.ink;
  ctx.fillRect(0, INIT_Y, NAT_W, NAT_H - INIT_Y);
  ctx.fillStyle = C.frameDark;
  ctx.fillRect(0, INIT_Y, NAT_W, 1);

  const n = S.units.length;
  const totalW = n * SLOT + (n - 1) * SLOT_GAP;
  const x0 = Math.round((NAT_W - totalW) / 2);
  const y0 = INIT_Y + 12;

  S.units.forEach((u, i) => {
    const x = x0 + i * (SLOT + SLOT_GAP);
    const im = i === S.turn ? IMG.slotActive
             : (i < S.turn ? IMG.slotDone : IMG.slotIdle);
    if (im) ctx.drawImage(im, x, y0);
    const isDown = S.down.has(i);
    const col = isDown ? {fill: C.dead, hi: "#4a4a50"} : SIDE[u.side];
    bevel(x + 6, y0 + 6, 28, 28, col.fill, col.hi, C.ink);
    drawTextCentre(ctx, u.tag, x + SLOT / 2, y0 + SLOT / 2 - 3,
                   isDown ? "#8a8a90" : C.parchHi);
    if (i < S.turn) {
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillRect(x + 6, y0 + 6, 28, 28);
    }
    drawTextCentre(ctx, String(i + 1), x + SLOT / 2, y0 + SLOT + 2,
                   i === S.turn ? C.goldHi : C.frameMid);
  });
}

const HELP = [
  "SPACE / F13    CLOCK DOWN",
  "SHIFT SPACE    CLOCK UP",
  "F14            CLOCK UP",
  "RIGHT / F15    NEXT TURN",
  "LEFT           PREVIOUS TURN",
  "1 TO 9         JUMP TO SLOT",
  "D / F16        TOGGLE DOWNED",
  "X              DAMAGE ACTIVE",
  "S              HEAL ACTIVE",
  "L / F17        TOGGLE LAW",
  "R / F18        RESET CLOCK",
  "G              TOGGLE GRID",
  "H              THIS PANEL",
];

function drawHelp() {
  ctx.fillStyle = "rgba(10,12,17,0.93)";
  ctx.fillRect(0, 0, NAT_W, NAT_H);
  const w = 260, h = HELP.length * 10 + 34;
  const x = Math.round((NAT_W - w) / 2), y = Math.round((NAT_H - h) / 2);
  bevel(x, y, w, h, C.inkSoft, C.frameMid, C.frameDark);
  ctx.strokeStyle = C.gold; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  drawTextCentre(ctx, "GM CONTROLS", x + w / 2, y + 10, C.goldHi);
  HELP.forEach((line, i) => {
    drawText(ctx, line, x + 14, y + 26 + i * 10, C.parchment);
  });
}

function drawDiag() {
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, NAT_W, NAT_H);
  drawText(ctx, "MISSING UI ASSETS", 12, 12, C.bloodHi);
  drawText(ctx, "EXPECTED IN  " + UI, 12, 26, C.frameLight);
  MISSING.slice(0, 26).forEach((f, i) => {
    drawText(ctx, f.replace("wbl_ui_", "").replace(".png", ""),
             12, 44 + i * 10, C.parchment);
  });
  if (MISSING.length > 26) {
    drawText(ctx, "PLUS " + (MISSING.length - 26) + " MORE", 12, 44 + 26 * 10, C.warn);
  }
}

function draw() {
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, NAT_W, NAT_H);
  if (MISSING.length) { drawDiag(); return; }
  drawTopBar();
  drawBoard();
  drawInitStrip();
  if (S.showHelp) drawHelp();
}

/* -- 8. CONTROLS ------------------------------------------------------ */

function nextTurn(step) {
  const n = S.units.length;
  S.turn += step;
  if (S.turn >= n) { S.turn = 0; S.round++; }
  if (S.turn < 0)  { S.turn = n - 1; S.round = Math.max(1, S.round - 1); }
}

const KEYS = {
  " ":        e => { S.clock = e.shiftKey
                       ? Math.min(ENCOUNTER.clockMax, S.clock + 1)
                       : Math.max(0, S.clock - 1); },
  "F13":      () => { S.clock = Math.max(0, S.clock - 1); },
  "F14":      () => { S.clock = Math.min(ENCOUNTER.clockMax, S.clock + 1); },
  "ArrowRight": () => nextTurn(1),
  "F15":        () => nextTurn(1),
  "ArrowLeft":  () => nextTurn(-1),
  "d":  () => { S.down.has(S.turn) ? S.down.delete(S.turn) : S.down.add(S.turn); },
  "F16":() => { S.down.has(S.turn) ? S.down.delete(S.turn) : S.down.add(S.turn); },
  "x":  () => { const u = S.units[S.turn]; if (u) u.hp = Math.max(0, u.hp - 1); },
  "s":  () => { const u = S.units[S.turn]; if (u) u.hp = Math.min(u.max, u.hp + 1); },
  "l":  () => { S.lawOn = !S.lawOn; },
  "F17":() => { S.lawOn = !S.lawOn; },
  "r":  () => { S.clock = ENCOUNTER.clockMax; },
  "F18":() => { S.clock = ENCOUNTER.clockMax; },
  "g":  () => { S.showGrid = !S.showGrid; },
  "h":  () => { S.showHelp = !S.showHelp; },
  "?":  () => { S.showHelp = !S.showHelp; },
  "Escape": () => { S.showHelp = false; },
};

window.addEventListener("keydown", e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (/^[1-9]$/.test(k)) {
    const i = parseInt(k, 10) - 1;
    if (i < S.units.length) { S.turn = i; draw(); e.preventDefault(); }
    return;
  }
  const fn = KEYS[k];
  if (fn) { fn(e); draw(); e.preventDefault(); }
});

window.addEventListener("resize", fitCanvas);

/* -- 9. BOOT ---------------------------------------------------------- */

loadAll().then(() => {
  if (ENCOUNTER.map) {
    const m = new Image();
    m.onload = () => { S.mapImg = m; draw(); };
    m.src = ENCOUNTER.map;
  }
  fitCanvas();
});
</script>
